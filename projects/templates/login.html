<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Domótico</title>
    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css" rel="stylesheet">
    <style>
        body {
            background-color: #2c3e50;
            color: white;
        }
        .camera-container {
            width: 640px;
            height: 480px;
            margin: 0 auto;
            border: 3px solid #3498db;
            border-radius: 5px;
        }
        #video {
            width: 100%;
            height: 100%;
            background-color: #666;
        }
        .btn-recognize {
            background-color: #16a085;
            color: white;
            font-weight: bold;
            padding: 12px 24px;
            font-size: 18px;
        }
    </style>
</head>
<body>
    <div class="container text-center py-5">
        <h1 class="mb-4">Sistema Domótico</h1>
        <h3 class="mb-5">Login por Reconocimiento Facial</h3>
        
        <div class="camera-container mb-4">
            <video id="video" autoplay></video>
            <canvas id="canvas" style="display:none;"></canvas>
        </div>
        
        <button id="recognizeBtn" class="btn btn-recognize">
            INICIAR RECONOCIMIENTO
        </button>
    </div>

    <script>
        const video = document.getElementById('video');
        const canvas = document.getElementById('canvas');
        const recognizeBtn = document.getElementById('recognizeBtn');
        
        // Acceder a la cámara
        navigator.mediaDevices.getUserMedia({ video: true })
            .then(stream => {
                video.srcObject = stream;
            })
            .catch(err => {
                console.error("Error al acceder a la cámara:", err);
                alert("No se pudo acceder a la cámara");
            });
        
        // Capturar imagen para reconocimiento
        recognizeBtn.addEventListener('click', () => {
            const context = canvas.getContext('2d');
            canvas.width = video.videoWidth;
            canvas.height = video.videoHeight;
            context.drawImage(video, 0, 0, canvas.width, canvas.height);
            
            const imageData = canvas.toDataURL('image/jpeg');
            
            fetch('/login_face', {
                method: 'POST',
                headers: {
                    'Content-Type': 'application/json',
                },
                body: JSON.stringify({ image: imageData })
            })
            .then(response => response.json())
            .then(data => {
                if (data.success) {
                    window.location.href = '/dashboard';
                } else {
                    alert("Rostro no reconocido. Intente nuevamente.");
                }
            })
            .catch(error => {
                console.error('Error:', error);
                alert("Error en el reconocimiento");
            });
        });
    </script>
</body>
</html>
